name: Deploy site to gh-pages
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"  # daily, to pick up changes to the recipe database
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7
