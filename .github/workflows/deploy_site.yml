name: Deploy site to gh-pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      # There is no build step: site/ is published as it is, and reads the recipe
      # database bundle at load, so a recipe change never needs a deploy. GitHub Pages
      # serves the gh-pages branch (Settings → Pages → Deploy from a branch, set once).
      - name: Publish site/ to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview  # keep open PR previews alive across deploys
          force: false
