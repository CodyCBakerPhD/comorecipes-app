name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test the data layer
        run: npm run test:coverage

      # The smoke tests load the pages against the bundle the site itself reads: the one the
      # database repo publishes on its dist branch after every merge.
      - name: Fetch the published database bundle
        run: |
          mkdir -p tests/fixtures
          curl -fsSL -o tests/fixtures/database.json.gz \
            https://raw.githubusercontent.com/CodyCBakerPhD/comorecipes-database/dist/database.json.gz

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Also records Chromium's coverage of site/js (tests/coverage.js): most of the site only
      # ever runs in a browser, so the unit tests alone reach two of its modules.
      - name: Smoke test the pages in a browser
        run: npm run test:e2e:coverage

      # One upload per suite, flagged, so Codecov shows what each covers as well as the merged
      # total. Settings are in .github/.codecov.yml.
      - name: Upload unit test coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/unit/lcov.info
          flags: unit
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload browser coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/e2e/lcov.info
          flags: e2e
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
